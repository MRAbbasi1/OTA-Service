name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    # The suite exercises the real schema and the optional MinIO integration
    # against service containers.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ota
          POSTGRES_PASSWORD: ota
          POSTGRES_DB: ota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: miniosecret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+psycopg://ota:ota@localhost:5432/ota_test
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: miniosecret
      OTA_MANIFEST_BASE_URL: https://api.ota-service.example
      OTA_FIRMWARE_BASE_URL: https://cdn.ota-service.example
      # A CI-only value; production refuses this default and requires a real one.
      ADMIN_JWT_SECRET: ci-only-admin-session-secret-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      # Exercise the deployment command itself, including its idempotence.
      - name: Bootstrap the first administrator
        env:
          BOOTSTRAP_ADMIN_EMAIL: ci@ota-service.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password-1
        run: |
          uv run ota-admin
          uv run ota-admin
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: MinIO integration tests
        env:
          RUN_MINIO_INTEGRATION: "1"
        run: uv run pytest -m integration
      - name: Audit dependencies
        run: uvx --from pip-audit pip-audit --requirement <(uv export --locked --no-dev --format requirements-txt)

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ota-service:test
          load: true
      - name: Smoke test image
        run: docker run --rm ota-service:test python -c "import app; print('image import ok')"
