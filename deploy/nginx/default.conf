limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=12r/m;
# A separate, much stricter ceiling for credential submission. The application
# limits the same surface per address *and* email (5/15m), which is the precise
# control; this zone is the coarse one that keeps a credential-stuffing run
# against many accounts from reaching the application at all.
limit_req_zone $binary_remote_addr zone=admin_login_per_ip:10m rate=10r/m;
# Rate limiting answers 429, never 403: a 403 would put a rate-limited device
# into the firmware's 24-hour lockout path (docs/15-implementation-decisions.md §7).
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    # Development: a single listener. Production serves the API and delivery
    # routes through this same upstream.
    server_name _;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000;
    }

    # Administrative login: throttled before the request reaches the app.
    location = /api/v1/admin/auth/login {
        limit_req zone=admin_login_per_ip burst=5 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000;
    }

    # OTA manifest endpoint, provisioned on devices as OTA_ONLINE_URL:
    #   /api/v1/firmware/{device_type}/{platform}/manifest.json
    # It must never answer with a redirect.
    location /api/v1/firmware/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000;
    }

    # Firmware delivery is served by this same application -- not MinIO and
    # not a static file server:
    #   /firmware/{device_type}/{platform}/v{version}/{filename}
    # Buffering is explicitly disabled so FastAPI can preserve the artifact's
    # exact Content-Length and the body is never re-framed as chunked.
    location /firmware/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000;
    }
}
