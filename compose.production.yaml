services:
  api:
    image: ${OTA_IMAGE:?OTA_IMAGE is required}
    env_file:
      - ${OTA_ENV_FILE:-/opt/ota-service/.env}
    environment:
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:${OTA_BIND_PORT:-18080}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      start_period: 15s
      retries: 6
    networks:
      - private

networks:
  private:
    driver: bridge
